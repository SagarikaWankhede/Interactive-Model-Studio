services:
  - type: web
    name: interactive-model-studio
    env: python
    region: oregon
    plan: free
    buildCommand: "bash build.sh"
    startCommand: "python -m uvicorn backend.main:app --host 0.0.0.0 --port $PORT"
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.8
      - key: SECRET_KEY
        generateValue: true
